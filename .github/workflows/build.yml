name: Build
on:
  push:
  pull_request:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: |
          swift build -c release
          swift test
      - name: Verify Universal app
        run: |
          ./script/build_and_run.sh --build
          lipo "dist/Project Hub.app/Contents/MacOS/ProjectHub" -verify_arch x86_64 arm64
